<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Wrap</title>
  <meta name="description" content="Every picture wraps twice: first when the shooting stops, and finally when the last person who made it is gone.">

  <!-- The tab. favicon.svg is the drawing and the only thing to edit; the
       two PNGs are rasterisations of it, for Safari before 16 and for iOS
       home screens, and are regenerated with:

         qlmanage -t -s 180 -o . favicon.svg && mv favicon.svg.png apple-touch-icon.png
         qlmanage -t -s 32  -o . favicon.svg && mv favicon.svg.png favicon-32.png

       Order matters: browsers that understand SVG take the first line and
       stop, older ones fall through to the PNG. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Paints the browser's own chrome to match the page it's framing —
       the same two --paper values style.css switches between. -->
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)">

  <!-- Bump ?v= on BOTH tags whenever style.css or app.js changes. Browsers
       cache these hard; without a new URL, returning visitors keep the old
       version until they hard-refresh. The number is arbitrary — any change
       works — but keeping them in step makes it one edit to remember. -->
  <link rel="stylesheet" href="style.css?v=71">
</head>
<body>

  <header class="masthead">
    <a class="wordmark" href="#">
      <span class="wordmark-rule"></span>
      <h1>Picture&nbsp;Wrap</h1>
    </a>
    <p class="tagline">Every picture wraps twice</p>
    <!-- Hidden on the landing page, where the chips already lead there. -->
    <nav class="nav" id="nav" hidden><a href="#/archive">The Vault</a></nav>
  </header>

  <div class="search" role="search">
    <input
      id="q"
      type="search"
      placeholder="Search by picture or maker"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search by picture or maker"
      aria-expanded="false"
      aria-controls="suggestions">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <main id="stage">
    <!-- rendered by app.js -->
  </main>

  <!-- The sources used to be listed here on every page. They are on the
       About page instead, which is where somebody goes when they want to
       know how much to trust what they are reading — and TMDB's required
       attribution lives there with them.

       What is left is the two things a footer is actually for: who made
       this, and the way further in. Corrections are not among them; those
       are offered on the film page itself and point at Wikidata, where a
       fix helps everyone downstream rather than only this archive.

       The byline is a mailto until jacobhenderson.studio is ready to be
       pointed at. Swap the href when it is; nothing else needs to change. -->
  <footer class="colophon">
    <p>
      by <a href="mailto:jacob@jacobhenderson.studio">Jacob Henderson</a>
      <span class="dot">&middot;</span>
      <a id="colophon-link" href="#/about">Methods and sources</a>
    </p>
    <!-- Required by TMDB's API terms, in their wording, and unconditional.
         It used to be revealed only when a TMDB key was set, on the
         reasoning that crediting a source we never called would be false.
         That was right when every page was computed live. The corpus now
         ships dates TMDB supplied whether or not this browser ever calls
         them, so the credit is owed on every page load. -->
    <p class="colophon-tmdb">
      This website uses TMDB and the TMDB APIs but is not endorsed,
      certified, or otherwise approved by
      <a href="https://www.themoviedb.org" rel="noopener">TMDB</a>.
    </p>
  </footer>

  <!-- type="module" so app.js can import shared.js, which the poster imports
       too. Native ES modules in both runtimes; still no build step. -->
  <script type="module" src="app.js?v=71"></script>
  <script src="embed-height.js"></script>
</body>
</html>
