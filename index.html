<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Wrap</title>
  <meta name="description" content="Every picture wraps twice: first when the shooting stops, and finally when the last person who made it is gone.">

  <!-- The tab. favicon.svg is the drawing and the only thing to edit; the
       two PNGs are rasterisations of it, for Safari before 16 and for iOS
       home screens, and are regenerated with:

         qlmanage -t -s 180 -o . favicon.svg && mv favicon.svg.png apple-touch-icon.png
         qlmanage -t -s 32  -o . favicon.svg && mv favicon.svg.png favicon-32.png

       Order matters: browsers that understand SVG take the first line and
       stop, older ones fall through to the PNG. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Paints the browser's own chrome to match the page it's framing —
       the same two --paper values style.css switches between. -->
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)">

  <!-- The card iMessage, Slack, WhatsApp and Bluesky draw when somebody
       pastes a link. Nobody visiting the site ever sees these; without
       them the link renders as a bare grey rectangle, which is what it did
       until 4 August 2026.

       SITE-WIDE, AND ONLY SITE-WIDE. Hash routing means
       /#/mildred-pierce/Q979726 never sends the id to a server, so a
       crawler asking for a film gets this same head. Every card is the
       front-page card. Making it per-picture needs a server that can see
       the path — see BACKLOG.md, which weighs moving to Cloudflare Pages
       where the corpus already lives. Most links people paste are the
       front page anyway.

       og:image must be ABSOLUTE — a relative URL resolves against the
       crawler, not the page — and 1200x630 is what iMessage wants for a
       large card. `card.png` is drawn by make-card.py, not edited.

       `twitter:` is still read by Slack and others despite the company it
       is named after having changed its name; the tag did not follow.

       The og/twitter description is deliberately NOT the same string as
       `<meta name="description">` above. A card is read in a second, at
       two lines, beside an image already carrying the idea; a search
       result is read cold with nothing else to go on. The short line is
       for the first and the epigraph is for the second. -->

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Picture Wrap">
  <meta property="og:url" content="https://picture-wrap.com/">
  <meta property="og:title" content="Picture Wrap">
  <meta property="og:description" content="The picture wraps twice">
  <meta property="og:image" content="https://picture-wrap.com/card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Picture Wrap — a gold bar across a dark field, the living above it and the dead below.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Picture Wrap">
  <meta name="twitter:description" content="The picture wraps twice">
  <meta name="twitter:image" content="https://picture-wrap.com/card.png">

  <!-- Bump ?v= on BOTH tags whenever style.css or app.js changes. Browsers
       cache these hard; without a new URL, returning visitors keep the old
       version until they hard-refresh. The number is arbitrary — any change
       works — but keeping them in step makes it one edit to remember. -->
  <link rel="stylesheet" href="style.css?v=96">
</head>
<body>

  <header class="masthead">
    <a class="wordmark" href="#">
      <span class="wordmark-rule"></span>
      <h1>Picture&nbsp;Wrap</h1>
    </a>
    <p class="tagline">The picture</p>
    <!-- Hidden on the landing page, where the chips already lead there. -->
    <nav class="nav" id="nav" hidden><a href="#/archive">The Vault</a><a href="#/unclassified">Unclassified</a></nav>
  </header>

  <div class="search" role="search">
    <input
      id="q"
      type="search"
      placeholder="Search by picture or maker"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search by picture or maker"
      aria-expanded="false"
      aria-controls="suggestions">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <main id="stage">
    <!-- rendered by app.js -->
  </main>

  <!-- The sources used to be listed here on every page. They are on the
       About page instead, which is where somebody goes when they want to
       know how much to trust what they are reading — and TMDB's required
       attribution lives there with them.

       What is left is the two things a footer is actually for: who made
       this, and the way further in. Corrections are not among them; those
       are offered on the film page itself and point at Wikidata, where a
       fix helps everyone downstream rather than only this archive.

       The byline is a mailto until jacobhenderson.studio is ready to be
       pointed at. Swap the href when it is; nothing else needs to change. -->
  <footer class="colophon">
    <p>
      by <a href="mailto:jacob@jacobhenderson.studio">Jacob Henderson</a>
      <span class="dot">&middot;</span>
      <a id="colophon-link" href="#/about">Methods and sources</a>
    </p>
    <!-- Required by TMDB's API terms, in their wording, and unconditional.
         It used to be revealed only when a TMDB key was set, on the
         reasoning that crediting a source we never called would be false.
         That was right when every page was computed live. The corpus now
         ships dates TMDB supplied whether or not this browser ever calls
         them, so the credit is owed on every page load.

         The logo is required alongside the wording. It closes the
         sentence rather than sitting above it: the notice ends on the
         word TMDB, so the mark can BE that word instead of repeating it.
         Stacked above, it said TMDB four times in three lines and read as
         a badge bolted to the foot of the page.

         `alt="TMDB"` is load-bearing — it keeps the required wording
         intact for a screen reader, which reads the sentence exactly as
         the terms write it.

         `tmdb.svg` is their `blue_short` mark unaltered; it is a single
         path filled with one gradient and recolouring it is not ours to
         do, which is why nothing here tries. The nbsp keeps "by" and the
         mark on one line, so a wrap can never strand it. -->
    <p class="colophon-tmdb">
      This website uses TMDB and the TMDB APIs but is not endorsed,
      certified, or otherwise approved&nbsp;by <a
        href="https://www.themoviedb.org" rel="noopener"
        ><img src="tmdb.svg" alt="TMDB" class="tmdb-mark" width="273" height="36"></a>.
    </p>
  </footer>

  <!-- type="module" so app.js can import shared.js, which the poster imports
       too. Native ES modules in both runtimes; still no build step. -->
  <script type="module" src="app.js?v=96"></script>
  <script src="embed-height.js"></script>
</body>
</html>
