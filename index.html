<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Wrap</title>
  <meta name="description" content="Every picture wraps twice. Once when the shooting stops, and once when the last person who made it is gone.">
  <!-- Bump ?v= on BOTH tags whenever style.css or app.js changes. Browsers
       cache these hard; without a new URL, returning visitors keep the old
       version until they hard-refresh. The number is arbitrary — any change
       works — but keeping them in step makes it one edit to remember. -->
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

  <header class="masthead">
    <a class="wordmark" href="#">
      <span class="wordmark-rule"></span>
      <h1>Picture&nbsp;Wrap</h1>
    </a>
    <p class="tagline">Every picture wraps twice</p>
    <!-- Hidden on the landing page, where the chips already lead there. -->
    <nav class="nav" id="nav" hidden><a href="#/archive">The Vault</a></nav>
  </header>

  <div class="search" role="search">
    <input
      id="q"
      type="search"
      placeholder="Search a film or a performer"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search a film or a performer"
      aria-expanded="false"
      aria-controls="suggestions">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <main id="stage">
    <!-- rendered by app.js -->
  </main>

  <footer class="colophon">
    <p>
      Cast, credits and death dates from
      <a href="https://www.wikidata.org" rel="noopener">Wikidata</a>;
      portraits from
      <a href="https://commons.wikimedia.org" rel="noopener">Wikimedia Commons</a><span
        id="tmdb-credit" hidden>; character names from
        <a href="https://www.themoviedb.org" rel="noopener">TMDB</a></span>.
      All are edited by volunteers and none is complete.
      <a href="#/about">More</a>
    </p>
    <p class="colophon-caveat">
      Absence of a death date is not evidence of life.
    </p>
  </footer>

  <!-- type="module" so app.js can import shared.js, which the poster imports
       too. Native ES modules in both runtimes; still no build step. -->
  <script type="module" src="app.js?v=14"></script>
</body>
</html>
