<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Wrap</title>
  <meta name="description" content="Every picture wraps twice: first when the shooting stops, and finally when the last person who made it is gone.">

  <!-- The tab. favicon.svg is the drawing and the only thing to edit; the
       two PNGs are rasterisations of it, for Safari before 16 and for iOS
       home screens, and are regenerated with:

         qlmanage -t -s 180 -o . favicon.svg && mv favicon.svg.png apple-touch-icon.png
         qlmanage -t -s 32  -o . favicon.svg && mv favicon.svg.png favicon-32.png

       Order matters: browsers that understand SVG take the first line and
       stop, older ones fall through to the PNG. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Paints the browser's own chrome to match the page it's framing —
       the same two --paper values style.css switches between. -->
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)">

  <!-- Bump ?v= on BOTH tags whenever style.css or app.js changes. Browsers
       cache these hard; without a new URL, returning visitors keep the old
       version until they hard-refresh. The number is arbitrary — any change
       works — but keeping them in step makes it one edit to remember. -->
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>

  <header class="masthead">
    <a class="wordmark" href="#">
      <span class="wordmark-rule"></span>
      <h1>Picture&nbsp;Wrap</h1>
    </a>
    <p class="tagline">Every picture wraps twice</p>
    <!-- Hidden on the landing page, where the chips already lead there. -->
    <nav class="nav" id="nav" hidden><a href="#/archive">The Vault</a></nav>
  </header>

  <div class="search" role="search">
    <input
      id="q"
      type="search"
      placeholder="Search a picture or a maker"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search a picture or a maker"
      aria-expanded="false"
      aria-controls="suggestions">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <main id="stage">
    <!-- rendered by app.js -->
  </main>

  <footer class="colophon">
    <!-- TMDB's half is hidden until a key is actually set, because
         crediting a source we never call would be its own small lie. What
         it says has to stay true as well: since both databases are asked
         about life and death, "character names from TMDB" understated it
         to the point of being wrong. -->
    <p>
      Cast, credits and dates from
      <a href="https://www.wikidata.org" rel="noopener">Wikidata</a><span
        id="tmdb-credit" hidden> and
        <a href="https://www.themoviedb.org" rel="noopener">TMDB</a></span>;
      portraits from
      <a href="https://commons.wikimedia.org" rel="noopener">Wikimedia Commons</a>.
      All are edited by volunteers and none is complete.
      <a href="#/about">More</a>
    </p>
  </footer>

  <!-- type="module" so app.js can import shared.js, which the poster imports
       too. Native ES modules in both runtimes; still no build step. -->
  <script type="module" src="app.js?v=27"></script>
</body>
</html>
